# Foreclosure auction tracker settings.

# Google Sheet to update ("MA Weekly Auctions"). The tracker only writes to its own
# tabs (names below) and never touches any other tab in the sheet.
spreadsheet_id: 1jURtqtgCVPJKUb1nPgAya-gLPw86Tzw9OeCBxhlvZhk
# "Foreclosure Auctions" Google Calendar: upcoming sales are mirrored onto it (calendar_sync.py).
calendar_id: ffccdc46f08fae95a99ed4101432cf6349e89a17ad6633a9571fd01583466780@group.calendar.google.com
tabs:
  tracker: "Auto - Auction Tracker"
  cancelled: "Auto - Cancelled & Postponed"
  changes: "Auto - Status Changes"
  call_list: "Auto - Owner Call List"
  sources: "Auto - Source Health"
  # Mortgage data from PropStream: import the lookup tab's addresses into PropStream,
  # export them, and paste the export (with headers) into the export tab.
  propstream_lookup: "Auto - PropStream Lookup"
  propstream_export: "PropStream Export"

counties: [Berkshire, Hampden, Hampshire, Franklin, Worcester]

# Leave empty to track every town in the counties above. To narrow it down, list towns:
#   towns: [Springfield, Chicopee, Holyoke, Westfield, Ware, Palmer]
towns: []

# How far ahead/behind to keep auctions on the tracker tab.
keep_days_past: 14
public_notice_lookback_days: 90

# Small towns with little or no municipal sewer. Properties here show "Likely SEPTIC -
# verify" unless the listing says otherwise. Everywhere else shows the listing's own
# wording, or "Verify w/ BOH". Edit this list as you confirm towns with each Board of Health.
likely_septic_towns: [
  Alford, Becket, Florida, Hancock, Monterey, Mount Washington, New Ashford,
  New Marlborough, Otis, Peru, Richmond, Sandisfield, Savoy, Tyringham, Washington,
  Windsor, Ashfield, Conway, Hawley, Heath,
  Leverett, Leyden, Monroe, New Salem, Rowe, Shutesbury, Warwick, Wendell, Whately,
  Blandford, Brimfield, Granville, Hampden, Holland, Montgomery, Tolland, Wales,
  Chesterfield, Cummington, Goshen, Middlefield, Pelham, Plainfield, Westhampton,
  Worthington, Berlin, Bolton, Boylston, Hubbardston, Mendon, New Braintree,
  Oakham, Petersham, Phillipston, Princeton, Royalston, 
]

