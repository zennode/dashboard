name: Foreclosure auction tracker

on:
  schedule:
    # Times are UTC: about 7:15am, 10:15am, 12:15pm, 3:15pm and 6:15pm Eastern (an hour
    # earlier in winter). GitHub can start scheduled runs a few minutes late.
    - cron: "15 11,14,16,19,22 * * *"
  workflow_dispatch: {}

concurrency:
  group: foreclosure-tracker
  cancel-in-progress: false

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: foreclosure_tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: foreclosure_tracker/requirements.txt

      - run: pip install -r requirements.txt

      # The run-to-run memory (what each auction looked like last time, assessor lookups)
      # lives in the Actions cache rather than the repo, so owner names never get committed.
      - name: Restore tracker state
        uses: actions/cache/restore@v4
        with:
          path: foreclosure_tracker/state
          key: foreclosure-state-${{ github.run_id }}
          restore-keys: foreclosure-state-

      - name: Update Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python tracker.py

      - name: Save tracker state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: foreclosure_tracker/state
          key: foreclosure-state-${{ github.run_id }}
