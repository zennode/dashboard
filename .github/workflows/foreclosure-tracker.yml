name: Foreclosure auction tracker

on:
  schedule:
    # Times are UTC: every two hours from about 6:40am to 6:40pm Eastern (an hour earlier
    # in winter), plus an extra early run on Fridays so the Friday email has fresh data.
    # GitHub often starts scheduled runs late or skips some when it's busy, so there are
    # more slots than strictly needed, on odd minutes away from the busy top of the hour.
    # A run takes about 5 minutes; 8 a day stays within the free Actions minutes.
    - cron: "41 10,12,14,16,18,20,22 * * *"
    - cron: "11 10 * * 5"
  workflow_dispatch: {}

concurrency:
  group: foreclosure-tracker
  cancel-in-progress: false

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: foreclosure_tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: foreclosure_tracker/requirements.txt

      - run: pip install -r requirements.txt

      # The run-to-run memory (what each auction looked like last time, assessor lookups)
      # lives in the Actions cache rather than the repo, so owner names never get committed.
      - name: Restore tracker state
        uses: actions/cache/restore@v4
        with:
          path: foreclosure_tracker/state
          key: foreclosure-state-${{ github.run_id }}
          restore-keys: foreclosure-state-

      - name: Update Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python tracker.py

      - name: Save tracker state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: foreclosure_tracker/state
          key: foreclosure-state-${{ github.run_id }}
