name: Friday auctions email

on:
  schedule:
    # GitHub often starts scheduled jobs late or skips them when it's busy, so there are
    # several tries every Friday morning (times are UTC; 11:05 UTC is 7:05am Eastern in
    # summer, 6:05am in winter). The first try between 7am and noon Eastern sends the
    # email; the rest see it was already sent this week and stop.
    - cron: "5 11 * * 5"
    - cron: "35 11 * * 5"
    - cron: "5 12 * * 5"
    - cron: "35 12 * * 5"
    - cron: "5 13 * * 5"
    - cron: "35 13 * * 5"
    - cron: "5 14 * * 5"
    - cron: "35 14 * * 5"
    - cron: "5 15 * * 5"
  workflow_dispatch:
    inputs:
      week_of:
        description: "Monday of the week to send (YYYY-MM-DD); blank for next week"
        required: false
      mark_only:
        description: "Don't send; just record next week's email as already sent"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: foreclosure_tracker
    steps:
      - name: Work out which week this is for
        id: week
        working-directory: .
        run: |
          echo "monday=$(TZ=America/New_York date -d 'next monday' +%F)" >> "$GITHUB_OUTPUT"
          hour=$(TZ=America/New_York date +%-H)
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$hour" -lt 7 ] || [ "$hour" -ge 12 ]; }; then
            echo "skip=true" >> "$GITHUB_OUTPUT"  # outside 7am-noon Eastern
          fi
          if [ "${{ inputs.mark_only }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            mkdir -p foreclosure_tracker && date > foreclosure_tracker/.email-sent
            echo "mark=true" >> "$GITHUB_OUTPUT"
          fi

      # A tiny cache entry marks "next week's email is sent", so later tries skip.
      - name: Already sent this week?
        id: sent
        if: steps.week.outputs.skip != 'true' && github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: foreclosure_tracker/.email-sent
          key: weekly-email-sent-${{ steps.week.outputs.monday }}
          lookup-only: true

      - if: steps.week.outputs.skip != 'true' && steps.sent.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      - if: steps.week.outputs.skip != 'true' && steps.sent.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: foreclosure_tracker/requirements.txt

      - if: steps.week.outputs.skip != 'true' && steps.sent.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Build and send the email
        if: steps.week.outputs.skip != 'true' && steps.sent.outputs.cache-hit != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WEEK_OF: ${{ inputs.week_of }}
        run: |
          python send_weekly_email.py ${WEEK_OF:+--week-of "$WEEK_OF"}
          date > .email-sent

      # Mark the week sent (not for a hand-picked week_of, which is a test or a resend).
      - name: Remember it was sent
        if: >-
          steps.week.outputs.mark == 'true' ||
          (steps.week.outputs.skip != 'true' && steps.sent.outputs.cache-hit != 'true' && inputs.week_of == '')
        uses: actions/cache/save@v4
        with:
          path: foreclosure_tracker/.email-sent
          key: weekly-email-sent-${{ steps.week.outputs.monday }}
