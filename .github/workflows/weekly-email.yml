name: Friday auctions email

on:
  schedule:
    # Fridays at 7:45am Eastern. Cron is UTC, so there is one line for daylight time
    # (11:45 UTC) and one for standard time (12:45 UTC); the job skips the one that
    # doesn't match the current offset.
    - cron: "45 11 * * 5"
    - cron: "45 12 * * 5"
  workflow_dispatch:
    inputs:
      week_of:
        description: "Monday of the week to send (YYYY-MM-DD); blank for next week"
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: foreclosure_tracker
    steps:
      - name: Skip the cron line for the other half of the year
        id: tz
        working-directory: .
        run: |
          offset=$(TZ=America/New_York date +%z)
          want="45 12 * * 5"; [ "$offset" = "-0400" ] && want="45 11 * * 5"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "$want" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.tz.outputs.skip != 'true'
        uses: actions/checkout@v4

      - if: steps.tz.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: foreclosure_tracker/requirements.txt

      - if: steps.tz.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Build and send the email
        if: steps.tz.outputs.skip != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WEEK_OF: ${{ inputs.week_of }}
        run: python send_weekly_email.py ${WEEK_OF:+--week-of "$WEEK_OF"}
