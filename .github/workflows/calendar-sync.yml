name: Calendar sync

# Hourly: copy the tracker tabs onto the "Foreclosure Auctions" Google Calendar, so edits
# typed into the sheet show up within the hour. The full tracker (foreclosure-tracker.yml)
# also syncs the calendar at the end of each of its runs.
on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch: {}

concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: foreclosure_tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: foreclosure_tracker/requirements.txt

      - run: pip install -r requirements.txt

      - name: Sync the calendar from the sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python calendar_sync.py
